spring:
  messages:
    basename: messages
    encoding: UTF-8

  application:
    name: hedging
    version: 0.1.0
  liquibase:
    # https://contribute.liquibase.com/extensions-integrations/directory/integration-docs/springboot/configuration/
    change-log: classpath:db/changelog/changelog-root.xml
    drop-first: false
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    #    hibernate:
    #      # ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false
app:
  notification:
    tggroupid: ${APP_TG_NOTIFICATION_GROUP_ID:-4897300417}
  auth:
    jwtExpirationMs: 100000000
    jwtSecret: ${APP_JWT_SECRET:thisisaverylongsecretkeyforuseinthejtwtokengenerationprocess123}
  gsheets:
    sa-json: ${APP_GGL_SA_FILE_LOCATION}
    emails: ${APP_GGL_SHARE_EMAILS}
  python-http-proxy:
    url: ${APP_PYTHON_PROXY_URL:http://127.0.0.1:8000}
    url1: ${APP_PYTHON_PROXY_URL_1:http://127.0.0.1:9001}
    url2: ${APP_PYTHON_PROXY_URL_2:http://127.0.0.1:9002}
    url3: ${APP_PYTHON_PROXY_URL_3:http://127.0.0.1:9003}
    url4: ${APP_PYTHON_PROXY_URL_4:http://127.0.0.1:9004}
    url5: ${APP_PYTHON_PROXY_URL_5:http://127.0.0.1:9005}
    url6: ${APP_PYTHON_PROXY_URL_6:http://127.0.0.1:9006}
    url7: ${APP_PYTHON_PROXY_URL_7:http://127.0.0.1:9007}
    url8: ${APP_PYTHON_PROXY_URL_8:http://127.0.0.1:9008}
    url9: ${APP_PYTHON_PROXY_URL_9:http://127.0.0.1:9009}
    url10: ${APP_PYTHON_PROXY_URL_10:http://127.0.0.1:9010}
  encryption:
    keyBase64: ${APP_ENCRYPTION_KEY_BASE64:de3AP3DtOeBDXXijf3PmLhrJ1kobB1XLP5poYc3qrkc=}
  mapdb:
    db-path: ${APP_MAPDB_PATH:cache/hedging.db}
  telegram:
    bot:
      token: ${TELEGRAM_BOT_TOKEN:token123}

logging:
  #  structured:
  #    format:
  #      console: ecs
  #      file: ecs
  file:
    name: ${LOGS_FOLDER:./logs}/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 7

management:
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
  endpoints:
    web:
      exposure:
        include: prometheus, health
      discovery:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true