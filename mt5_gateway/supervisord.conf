[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/mt5-supervisor.pid

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:terminal]
command=/opt/gateway/scripts/run-terminal.sh
priority=20
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=/opt/gateway/scripts/run-gateway.sh
priority=30
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
