services:
  mt5:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    ports:
      - 3000:3000
      - 8001:8001

  ptyhonhttpproxy:
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    ports:
      - 8000:8000

  postgres:
    extends:
      file: docker-compose-base.yaml
      service: postgresservice
    ports:
      - "5432:5432"

volumes:
  data1: { }