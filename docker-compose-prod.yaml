services:
  # It's still required to expose 3000 to enable AlgoTrading manually through the VNC. (I don't know how to do it automatically.)
  # After that, Block the 3000 port in the firewall.
  mt5:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    ports:
      - 3000:3000

  postgres:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: postgresservice

  migration:
    extends:
      file: docker-compose-base.yaml
      service: migrationservice
    depends_on:
      postgres:
        condition: service_healthy
        required: true

  server:
    restart: unless-stopped
    image: oress/tg_bot
    build: ./tg_server
    depends_on:
      migration:
        condition: service_completed_successfully
        required: true
    volumes:
      - appLogs:${LOGS_FOLDER}
      - ./keys:/keys
    environment:
      - PYTHONPATH=/
      - LOGS_FOLDER
      - ENCRYPTION_KEY
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB_HOST
      - POSTGRES_DB_PORT
      - MT5_HOST
      - MT5_PORT
      - MT5_SERVER
      - HEDGE_CITIES
      - HEDGE_INSTRUMENTS
      - SUPERADMIN_ID
      - TG_BOT_TOKEN
      - GGL_SA_FILE_LOCATION=/keys/key.json
      - GGL_SPREADSHEET_ID
      - GGL_SHEET_SYNC_INVTERVAL

  alloy:
    restart: unless-stopped
    image: grafana/alloy:latest
    depends_on:
      - server
    environment:
      - ALLOY_USERNAME
      - GRAFANA_TOKEN
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - appLogs:${LOGS_FOLDER}
    command: 'run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy'

  db_backup_cron:
    extends:
      file: docker-compose-base.yaml
      service: db_backup_cron_service
    depends_on:
      postgres:
        condition: service_healthy
        required: true
volumes:
  appLogs: { }
  data1: { }
