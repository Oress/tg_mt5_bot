      service: pythonproxyservice
    environment:
      - MT5_HOST=mt5_8

  ptyhonhttpproxy_9:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    environment:
      - MT5_HOST=mt5_9

  ptyhonhttpproxy_10:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    environment:
      - MT5_HOST=mt5_10

  server:
    restart: unless-stopped
    image: hedging_bot
    build: ./hedging
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    volumes:
      - ./cache:/cache
      - appLogs:${LOGS_FOLDER}
      - ./keys:/keys
    environment:
      - APP_MAPDB_PATH=/cache/hedging.db
      - LOGS_FOLDER
      - POSTGRES_URL
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB_HOST
      - POSTGRES_DB_PORT
      - APP_ENCRYPTION_KEY_BASE64
      - APP_JWT_SECRET
      - APP_TELEGRAM_BOT_TOKEN
      - APP_PYTHON_PROXY_URL
      - APP_PYTHON_PROXY_URL_1
      - APP_GGL_SA_FILE_LOCATION
      - APP_GGL_SHARE_EMAILS

