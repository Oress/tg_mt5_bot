services:
  # It's still required to expose 3000 to enable AlgoTrading manually through the VNC. (I don't know how to do it automatically.)
  # After that, Block the 3000 port in the firewall.
  mt5:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    ports:
      - 3000:3000

  mt5_1:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config1:/config
    ports:
      - 4001:3000

  mt5_2:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config2:/config
    ports:
      - 4002:3000

  mt5_3:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config3:/config
    ports:
      - 4003:3000

  mt5_4:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config3:/config
    ports:
      - 4004:3000

  mt5_5:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config3:/config
    ports:
      - 4005:3000

  mt5_6:
    extends:
