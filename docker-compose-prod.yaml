      - ./config3:/config
    ports:
      - 4008:3000

  mt5_9:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config3:/config
    ports:
      - 4009:3000

  mt5_10:
    extends:
      file: docker-compose-base.yaml
      service: mt5service
    restart: unless-stopped
    volumes:
      - ./config3:/config
    ports:
      - 4010:3000

  postgres:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: postgresservice

  ptyhonhttpproxy:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice

  ptyhonhttpproxy_1:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    environment:
      - MT5_HOST=mt5_1

  ptyhonhttpproxy_2:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    environment:
      - MT5_HOST=mt5_2

  ptyhonhttpproxy_3:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    environment:
      - MT5_HOST=mt5_3

  ptyhonhttpproxy_4:
    restart: unless-stopped
    extends:
      file: docker-compose-base.yaml
      service: pythonproxyservice
    environment:
